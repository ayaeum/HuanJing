services:
  huanjing:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      WORKERS: "4"
      AI_MODE: "${AI_MODE:-real}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS:-45}"
      AI_RELEVANCE_THRESHOLD: "${AI_RELEVANCE_THRESHOLD:-0.65}"
    volumes:
      - huanjing-data:/app/data
    restart: unless-stopped
    stop_grace_period: 15s
volumes:
  huanjing-data:
